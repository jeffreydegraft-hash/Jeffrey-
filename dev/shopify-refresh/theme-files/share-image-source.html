<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cormorant;font-weight:600;src:url(fonts/cormorant-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
html,body{margin:0}body{width:1200px;height:630px;background:#faf7f2;color:#2c3227;overflow:hidden;position:relative;font-family:Montserrat,sans-serif}
.mark{position:absolute;top:84px;left:0;right:0;text-align:center;font-family:Cormorant,serif;font-weight:600;font-size:58px;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.mark .of{font-size:.6em;text-transform:lowercase;letter-spacing:.06em;vertical-align:.14em;margin:0 .1em}
.eyebrow{position:absolute;top:170px;left:0;right:0;text-align:center;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#7a5f30}
.line{position:absolute;left:50%;top:214px;width:72px;height:2px;background:#c4a265;margin-left:-36px}
.bottles{position:absolute;left:0;right:0;bottom:-70px;height:430px;overflow:hidden}
.bottles img{position:absolute;left:0;width:1200px;top:-32px;mix-blend-mode:multiply;filter:brightness(1.012)}
</style></head><body>
<div class="mark">Mount <span class="of">of</span> Olives</div>
<div class="eyebrow">The anointing oil collection · Biblical botanicals</div>
<div class="line"></div>
<div class="bottles"><img src="img/hero.jpg" alt=""></div>
</body></html>
